# Rôle nvidia_gpu : installe le pilote NVIDIA et, si demandé, rend le GPU utilisable par les conteneurs Docker.
# Le rôle docker doit être appliqué avant celui-ci.

- name: Vérifier que le système correspond aux paquets utilisés # Les noms de paquets du pilote sont propres à Ubuntu amd64.
  ansible.builtin.assert: # Module qui échoue si une condition est fausse.
    that: # Conditions à respecter.
      - ansible_facts.distribution == 'Ubuntu' # Paquets nvidia-driver-* et linux-modules-nvidia-* d'Ubuntu.
      - ansible_facts.architecture == 'x86_64' # Dépôt NVIDIA Container Toolkit amd64.
    fail_msg: Ce rôle cible Ubuntu amd64. # Message affiché en cas d'échec.

- name: Lire la liste des paquets installés # Permet de savoir si le toolkit est déjà présent.
  ansible.builtin.package_facts: # Module qui remplit ansible_facts.packages.
    manager: apt # Interroge la base de paquets APT.

- name: Installer le pilote NVIDIA et le module du noyau actif # Le module doit correspondre exactement au noyau qui tourne.
  ansible.builtin.apt: # Module qui gère les paquets APT.
    name: # Paquets à installer.
      - "nvidia-driver-{{ nvidia_gpu_driver_branch }}" # Pilote et outils, dont nvidia-smi.
      - "linux-modules-nvidia-{{ nvidia_gpu_driver_branch }}-generic" # Module précompilé qui suit les mises à jour du noyau générique.
      - "linux-modules-nvidia-{{ nvidia_gpu_driver_branch }}-{{ ansible_facts.kernel }}" # Module précompilé du noyau actif.
    state: present # Installe les paquets manquants.
    update_cache: true # Actualise la liste des paquets si elle est trop ancienne.
    cache_valid_time: 3600 # Considère la liste comme récente pendant une heure.

- name: Donner le GPU aux conteneurs Docker # Seulement si nvidia_gpu_container_toolkit est vrai.
  when: nvidia_gpu_container_toolkit | bool # Condition partagée par toutes les tâches du bloc.
  block: # Groupe de tâches soumises à la même condition.
    - name: Déclarer le dépôt NVIDIA sur une nouvelle installation # Un hôte déjà équipé garde sa déclaration actuelle.
      when: "'nvidia-container-toolkit' not in ansible_facts.packages" # Condition partagée par le bloc imbriqué.
      block: # Groupe de tâches soumises à la même condition.
        - name: Chercher une déclaration du dépôt faite à la main # Évite de déclarer le même dépôt deux fois.
          ansible.builtin.stat: # Module qui lit les propriétés d'un fichier.
            path: /etc/apt/sources.list.d/nvidia-container-toolkit.list # Nom utilisé par la procédure manuelle de NVIDIA.
          register: nvidia_gpu_manual_source # Mémorise si ce fichier existe.

        - name: Installer la clé APT du dépôt NVIDIA # APT vérifie les paquets avec cette clé.
          ansible.builtin.get_url: # Module qui télécharge un fichier.
            url: https://nvidia.github.io/libnvidia-container/gpgkey # Clé officielle de NVIDIA.
            dest: /etc/apt/keyrings/nvidia-container-toolkit.asc # Fichier de clé sur l'hôte.
            mode: '0644' # Lisible par APT.
          when: not nvidia_gpu_manual_source.stat.exists # Inutile si le dépôt est déjà déclaré à la main.

        - name: Déclarer le dépôt APT de NVIDIA Container Toolkit # Indique à APT où trouver le toolkit.
          ansible.builtin.template: # Module qui génère un fichier à partir d'un modèle.
            src: nvidia-container-toolkit.sources.j2 # Modèle situé dans templates/ du rôle.
            dest: /etc/apt/sources.list.d/nvidia-container-toolkit.sources # Fichier lu par APT.
            mode: '0644' # Lisible par APT.
          when: not nvidia_gpu_manual_source.stat.exists # Inutile si le dépôt est déjà déclaré à la main.

    - name: Installer NVIDIA Container Toolkit # Fournit nvidia-ctk et le runtime nvidia.
      ansible.builtin.apt: # Module qui gère les paquets APT.
        name: nvidia-container-toolkit # Paquet du toolkit.
        state: present # Installe le paquet s'il manque.
        update_cache: true # Relit les dépôts, dont celui qui vient d'être déclaré.
      when: "'nvidia-container-toolkit' not in ansible_facts.packages and not ansible_check_mode" # En simulation, le dépôt n'existe pas encore.

    - name: Lire les runtimes connus de Docker # Indique si le runtime nvidia est déjà déclaré.
      ansible.builtin.command: # Module qui exécute une commande sans shell.
        argv: [docker, info, --format, '{{ "{{json .Runtimes}}" }}'] # Le format Go est protégé pour qu'Ansible ne l'interprète pas.
      register: nvidia_gpu_docker_runtimes # Liste des runtimes au format JSON.
      check_mode: false # Lecture exécutée aussi en simulation.
      changed_when: false # Cette lecture ne modifie rien.

    - name: Déclarer le runtime nvidia dans Docker # Seulement s'il manque.
      when: # Toutes les conditions doivent être vraies.
        - not ansible_check_mode # Les commandes suivantes ne savent pas simuler.
        - "'nvidia' not in (nvidia_gpu_docker_runtimes.stdout | from_json)" # Le runtime n'est pas encore connu de Docker.
      block: # Groupe de tâches soumises aux mêmes conditions.
        - name: Calculer la configuration Docker avec le runtime nvidia # nvidia-ctk part du daemon.json actuel et conserve ses réglages.
          ansible.builtin.command: # Module qui exécute une commande sans shell.
            argv: [nvidia-ctk, runtime, configure, --runtime=docker, --dry-run] # Affiche le résultat sans écrire le fichier.
          register: nvidia_gpu_docker_config # Configuration complète proposée.
          changed_when: false # Ce calcul ne modifie rien.

        - name: Écrire la configuration Docker avec le runtime nvidia # Validée par dockerd avant installation.
          ansible.builtin.copy: # Module qui écrit un contenu dans un fichier.
            dest: /etc/docker/daemon.json # Configuration du moteur Docker.
            content: "{{ nvidia_gpu_docker_config.stdout | from_json | to_nice_json }}\n" # JSON proposé par nvidia-ctk, remis en forme.
            mode: '0644' # Lisible par le service.
            backup: true # Conserve l'ancienne version du fichier.
            validate: /usr/bin/dockerd --validate --config-file=%s # Refuse un fichier que dockerd ne saurait pas lire.

        - name: Redémarrer Docker pour charger le runtime nvidia # Docker ne relit daemon.json qu'au démarrage.
          ansible.builtin.systemd_service: # Module qui pilote systemd.
            name: docker # Service concerné.
            state: restarted # Redémarre le moteur.

- name: Vérifier si le pilote NVIDIA répond # Le module du noyau peut ne pas être chargé juste après l'installation.
  ansible.builtin.command: # Module qui exécute une commande sans shell.
    argv: [nvidia-smi, -L] # Liste les GPU visibles par le pilote.
  register: nvidia_gpu_probe # Code retour et sortie de la commande.
  check_mode: false # Lecture exécutée aussi en simulation.
  changed_when: false # Cette lecture ne modifie rien.
  failed_when: false # Un échec est traité par la tâche suivante.

- name: Charger le module NVIDIA si nécessaire # Évite un redémarrage complet de l'hôte.
  ansible.builtin.command: # Module qui exécute une commande sans shell.
    argv: [modprobe, nvidia] # Charge le module du noyau.
  when: nvidia_gpu_probe.rc != 0 and not ansible_check_mode # Seulement si le pilote ne répond pas.
