# Rôle haproxy : relais TCP filtré par adresse source, ici pour donner accès à Samba depuis le réseau Maison.

- name: Installer HAProxy # Paquet du relais.
  ansible.builtin.apt: # Module qui gère les paquets APT.
    name: haproxy # Paquet à installer.
    state: present # Installe le paquet s'il manque.

- name: Générer la configuration HAProxy # Écoute, filtrage et serveur de destination.
  ansible.builtin.template: # Module qui génère un fichier à partir d'un modèle.
    src: haproxy-samba.cfg.j2 # Modèle situé dans templates/ du rôle.
    dest: /etc/haproxy/haproxy.cfg # Configuration lue par HAProxy.
    owner: root # Compte propriétaire.
    group: root # Groupe propriétaire.
    mode: '0644' # Lisible par tous, modifiable par root.
    backup: true # Conserve l'ancienne version du fichier.
    validate: /usr/sbin/haproxy -c -f %s # Refuse un fichier que HAProxy ne saurait pas lire.
  notify: Redémarrer HAProxy # Programme le handler si la configuration change.

- name: Activer et démarrer HAProxy # Le service démarre aussi au boot.
  ansible.builtin.systemd_service: # Module qui pilote systemd.
    name: haproxy # Service concerné.
    enabled: true # Active le démarrage au boot.
    state: started # Démarre le service s'il est arrêté.
