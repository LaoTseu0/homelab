global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: jarvis-exporter
    static_configs:
      - targets: ["jarvis-exporter:9102"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

