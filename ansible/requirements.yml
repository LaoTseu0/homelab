# Collections Ansible nécessaires au projet, installées avec « ansible-galaxy collection install -r requirements.yml ».

collections: # Liste des collections.
  - name: ansible.posix # Modules Linux, dont mount et authorized_key.
    version: "2.2.2" # Version fixée.
  - name: community.docker # Modules Docker, dont docker_compose_v2, docker_login et docker_volume.
    version: "5.4.0" # Version fixée.
  - name: community.general # Modules divers, dont htpasswd.
    version: "13.5.1" # Version fixée.
