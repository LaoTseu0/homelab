# Profil du NAS : liste des rôles appliqués au Raspberry Pi 5, dans l'ordre.
# Lancement : ansible-playbook -i inventory.yml configurer-nas.yml --ask-become-pass --ask-vault-pass

- name: Configurer le NAS # Description du play.
  hosts: nas # Machine ciblée dans l'inventaire.
  gather_facts: true # Relève la distribution et l'architecture, utilisées par le rôle docker.
  become: true # Exécute les tâches avec sudo.

  roles: # Rôles appliqués, dans cet ordre.
    - role: admin_access # Clés SSH d'administration.
    - role: rpi_boot # Paramètres de démarrage du Pi ; redémarre si nécessaire.
    - role: data_disk # Montage du NVMe sur /srv et dépendance des services à ce montage.
      tags: [always] # Toujours exécuté, même avec --tags : les autres rôles écrivent sur le NVMe.
    - role: samba # Partages personnels SMB.
      tags: [samba] # Permet « --tags samba » pour ne traiter que Samba.
    - role: git_server # Dépôts Git servis par SSH à agent0.
      tags: [git_server] # Permet « --tags git_server ».
    - role: docker # Docker avec ses données sur le NVMe.
      tags: [docker] # Permet « --tags docker ».
    - role: registry # Registry d'images privé.
      tags: [registry] # Permet « --tags registry » sur un NAS déjà configuré.
