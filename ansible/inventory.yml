# Inventaire : la liste des machines gérées et la façon de s'y connecter.
# Les variables propres à chaque machine sont dans host_vars/<nom>, celles communes à toutes dans group_vars/all.yml.

all: # Groupe intégré qui englobe tous les hôtes de l'inventaire.
  hosts: # Machines membres de ce groupe.
    nas: # Nom de l'hôte dans Ansible, utilisé par « hosts: nas » et host_vars/nas/.
      ansible_host: pinas # Destination SSH : l'alias Host pinas du ~/.ssh/config dans Ubuntu/WSL.
      ansible_user: pinas # Compte Linux utilisé pour la connexion, avant une éventuelle élévation sudo.
    lab-1: # Nom Ansible du Pi 4 passerelle, utilisé par « hosts: lab-1 » et host_vars/lab-1.yml.
      ansible_host: lab-1 # Destination SSH : l'alias Host lab-1, qui définit l'adresse et la clé dans Ubuntu/WSL.
      ansible_user: lab-1 # Compte Linux utilisé sur le Pi 4, dont le hostname système est lab-rpi4-1.
    lab-studio: # Nom Ansible de la tour GPU, utilisé par « hosts: lab-studio » et host_vars/lab-studio.yml.
      ansible_host: 192.168.50.252 # Adresse IPv4 actuelle de la tour sur le réseau Homelab.
      ansible_user: studio # Compte Linux utilisé par SSH sur la tour.
      ansible_ssh_private_key_file: ~/.ssh/id_ed25519_jarvis_central # Clé privée sur le control node WSL ; nom à changer lors de la rotation de la clé.
    lab-forge: # Nom Ansible de la seconde tour GPU (RTX 4090). Pas encore de profil configurer-*.yml.
      ansible_host: lab-forge # Destination SSH : l'alias Host lab-forge, qui définit l'adresse et la clé dans Ubuntu/WSL.
      ansible_user: forge # Compte Linux utilisé par SSH sur la tour.
