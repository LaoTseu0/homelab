nas_data_uuid: "97498878-33ac-4e4b-bc8f-c6094172f15c" # UUID attendu pour le système de fichiers du NVMe.
nas_git_agent_repositories: # Dépôts restaurés auxquels le groupe agents accède.
  - framework.git
  - homelab.git
  - inference-au-harnais.git
  - memoire-agent.git
nas_smb_users: # Comptes Linux associés aux partages Samba.
  - name: oce # Nom du compte restauré.
    uid: 1001 # Identifiant numérique propriétaire des fichiers.
    gid: 1003 # Identifiant numérique de son groupe.
    directory: oceane # Nom du dossier sous /srv/partages.
    share: Oceane # Nom affiché aux clients SMB, utilisé dans \\nas\Oceane.
  - name: antho # Compte utilisé pour ton espace personnel.
    uid: 1005 # UID restauré pour ce compte.
    gid: 1005 # GID restauré pour son groupe.
    directory: antho # Nom du dossier sous /srv/partages.
    share: antho # Nom affiché aux clients SMB, utilisé dans \\nas\antho.
docker_apt_suite: trixie # Version Debian dont proviendront les paquets Docker.
docker_apt_arch: arm64 # Architecture des paquets pour le Raspberry Pi 5.
docker_rpi_memory_cgroups: true # Active ce réglage propre au Raspberry Pi pour cet hôte.
registry_image: "registry:3.1.2@sha256:82f6ff4a7f982960c8aa51617fea3aabc485df6e55cce80d22deb1de36f1bc3c" # Image officielle fixée par son digest, avec une variante ARM64.
registry_lan_ip: "192.168.50.198" # Adresse du NAS sur le réseau Homelab, utilisée par le certificat et l’écoute HTTPS.
registry_reader_user: lab-studio # Identifiant Docker de la tour sur le port de lecture (5001).
