# Variables du NAS (Raspberry Pi 5 avec NVMe).
# Les secrets sont chiffrés par Vault dans vault.yml et registry-reader.yml, à côté de ce fichier.

admin_access_keys_file: cles-ssh/pinas-authorized_keys # Clés SSH d'administration autorisées sur le compte pinas.

data_disk_uuid: "97498878-33ac-4e4b-bc8f-c6094172f15c" # UUID du système de fichiers du NVMe, monté sur /srv.
data_disk_dependent_services: # Services qui ne doivent pas démarrer sans le NVMe.
  - smbd # Samba : les partages sont sur le NVMe.
  - containerd # containerd : ses données sont sur le NVMe.
  - docker # Docker : ses données sont sur le NVMe.

samba_users: # Comptes Linux et partages personnels.
  - name: oce # Compte restauré.
    uid: 1001 # Identifiant numérique propriétaire des fichiers.
    gid: 1003 # Identifiant numérique de son groupe.
    directory: oceane # Dossier sous /srv/partages.
    share: Oceane # Partage vu par les clients : \\nas\Oceane.
  - name: antho # Compte de l'espace personnel d'Anthony.
    uid: 1005 # Identifiant numérique restauré.
    gid: 1005 # Identifiant numérique de son groupe.
    directory: antho # Dossier sous /srv/partages.
    share: antho # Partage vu par les clients : \\nas\antho.

git_server_group_gid: 1002 # Identifiant du groupe agents, conservé après réinstallation.
git_server_repositories: # Dépôts bare restaurés sous /srv/git.
  - framework.git # Dépôt de la formation.
  - homelab.git # Ce dépôt.
  - inference-au-harnais.git # Dépôt de projet.
  - memoire-agent.git # Dépôt de projet.
git_server_agents: # Comptes techniques autorisés à lire les dépôts par SSH.
  - name: agent0 # Compte utilisé par lab-studio.
    public_key_file: cles-ssh/agent0.pub # Clé publique de lab-studio, dans ansible/files/.

docker_data_root: /srv/docker # Données du moteur Docker sur le NVMe plutôt que sur la microSD.
docker_containerd_root: /srv/containerd # Données de containerd sur le NVMe.

registry_image: "registry:3.1.2@sha256:82f6ff4a7f982960c8aa51617fea3aabc485df6e55cce80d22deb1de36f1bc3c" # Image officielle Distribution, fixée par digest, avec variante ARM64.
registry_reader_user: lab-studio # Compte de téléchargement utilisé par la tour sur le port 5001.
