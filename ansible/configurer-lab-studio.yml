# Profil de la tour GPU : liste des rôles appliqués à lab-studio, dans l'ordre.
# Lancement : ansible-playbook -i inventory.yml configurer-lab-studio.yml --ask-become-pass --ask-vault-pass
# Le mot de passe Vault est nécessaire : le compte de lecture du registry est chiffré dans les variables du NAS.

- name: Configurer lab-studio # Description du play.
  hosts: lab-studio # Machine ciblée dans l'inventaire.
  gather_facts: true # Relève la distribution, l'architecture et le noyau, utilisés par les rôles docker et nvidia_gpu.
  become: true # Exécute les tâches avec sudo.

  roles: # Rôles appliqués, dans cet ordre.
    - role: docker # Docker depuis le dépôt officiel.
      tags: [docker] # Permet « --tags docker ».
    - role: nvidia_gpu # Pilote NVIDIA et accès des conteneurs au GPU ; après docker.
      tags: [nvidia_gpu] # Permet « --tags nvidia_gpu ».
    - role: registry_client # Confiance et compte de lecture pour le registry du NAS.
      tags: [registry_client] # Permet « --tags registry_client ».
    - role: ollama # Moteur LLM sur GPU et ses modèles.
      tags: [ollama] # Permet « --tags ollama » pour livrer seulement Ollama.
    - role: home_assistant # Home Assistant et sa chaîne vocale.
      tags: [home_assistant] # Permet « --tags home_assistant » pour livrer seulement cette stack.
    - role: wyoming_satellite # Micro et haut-parleur USB reliés à Home Assistant.
      tags: [wyoming_satellite] # Permet « --tags wyoming_satellite ».
