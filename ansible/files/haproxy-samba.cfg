# Relais SMB du réseau Maison vers le NAS du Homelab
global
    user haproxy
    group haproxy

defaults
    mode tcp
    timeout connect 5s
    timeout client 10m
    timeout server 10m

listen samba_maison
    bind 192.168.1.84:445
    acl telephones_autorises src 192.168.1.101/32 192.168.1.127/32
    tcp-request connection reject unless telephones_autorises
    server nas 192.168.50.198:445
