- name: Lire les informations du NAS
  hosts: nas
  gather_facts: true

  tasks:
    - name: Afficher le nom de la machine
      ansible.builtin.debug:
        var: ansible_facts['hostname']

    - name: Lire le montage de /srv
      ansible.builtin.command: # Exécute une commande sur le NAS.
        cmd: findmnt --mountpoint /srv --noheadings --output UUID # Renvoie uniquement l’UUID monté sur /srv.
      register: montage_srv # Conserve le résultat dans une variable pour les tâches suivantes.
      changed_when: false # Cette lecture ne doit signaler aucun changement.
      check_mode: false # Exécute cette lecture même lors d’un lancement avec --check.

    - name: Afficher le montage trouvé
      ansible.builtin.debug: # Affiche une valeur dans le terminal du control node.
        var: montage_srv.stdout # stdout contient le texte produit par findmnt.

    - name: Vérifier que /srv utilise le NVMe attendu
      ansible.builtin.assert: # Vérifie des conditions et fait échouer la tâche si elles sont fausses.
        that: # Liste des conditions à respecter.
          - montage_srv.stdout == nas_data_uuid # Compare l’UUID relevé à celui déclaré pour le NAS.
        fail_msg: "Le disque monté sur /srv ne correspond pas au NVMe attendu." # Message en cas d’échec.
        success_msg: "Le NVMe attendu est bien monté sur /srv." # Message si toutes les conditions passent.