groups:
  - name: jarvis
    rules:
      - alert: JarvisExporterUnavailable
        expr: up{job="jarvis-exporter"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "jarvis-exporter est indisponible"
          description: "Prometheus ne collecte plus les métriques applicatives de Jarvis depuis 2 minutes."

      - alert: JarvisGpuTemperatureHigh
        expr: max(jarvis_gpu_temperature_celsius) > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Température GPU élevée"
          description: "Au moins un GPU de Jarvis dépasse 85 °C depuis 5 minutes."

      - alert: JarvisAssistPipelineP95High
        expr: histogram_quantile(0.95, sum by (le) (rate(jarvis_assist_stage_duration_seconds_bucket{stage="pipeline"}[15m]))) > 4
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Latence vocale p95 élevée"
          description: "Le p95 du pipeline Assist dépasse 4 secondes depuis 10 minutes."

