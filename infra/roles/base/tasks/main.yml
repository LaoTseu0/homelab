---
- name: Installer le socle commun sans mise à niveau générale
  ansible.builtin.apt:
    name: "{{ homelab_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Configurer le fuseau horaire
  ansible.builtin.file:
    src: "/usr/share/zoneinfo/{{ homelab_timezone }}"
    dest: /etc/localtime
    state: link
    force: true

- name: Créer le répertoire des services
  ansible.builtin.file:
    path: /srv
    state: directory
    owner: root
    group: root
    mode: '0755'
