---
- name: Inventorier sans modifier les machines
  hosts: all
  gather_facts: true
  become: false
  tasks:
    - name: Lire les disques et montages
      ansible.builtin.command: lsblk --json -o NAME,SIZE,FSTYPE,MOUNTPOINTS,MODEL,UUID
      register: audit_disks
      changed_when: false
      check_mode: false

    - name: Lire les versions Docker et Compose si présents
      ansible.builtin.shell: |
        if command -v docker >/dev/null 2>&1; then
          docker --version
          docker compose version
        else
          printf 'Docker absent\n'
        fi
      register: audit_docker
      changed_when: false
      check_mode: false

    - name: Vérifier les répertoires de données sans lire les secrets
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /srv/git
        - /srv/partages
        - /srv/homeassistant
        - /srv/jarvis
      register: audit_paths

    - name: Afficher le rapport de la machine
      ansible.builtin.debug:
        msg:
          machine: "{{ inventory_hostname }}"
          systeme: "{{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }}"
          architecture: "{{ ansible_facts.architecture }}"
          disques: "{{ audit_disks.stdout | from_json }}"
          docker: "{{ audit_docker.stdout_lines }}"
          donnees: "{{ audit_paths.results | map(attribute='stat') | list }}"
