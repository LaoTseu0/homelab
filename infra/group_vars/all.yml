---
managed_enabled: false
docker_enabled: false
nas_enabled: false
jarvis_enabled: false
satellite_enabled: false
homelab_timezone: Europe/Paris
homelab_packages:
  - ca-certificates
  - curl
  - git
  - python3
  - python3-apt
  - rsync
homelab_repo_root: "{{ playbook_dir }}/.."
homelab_secrets_dir: "{{ playbook_dir }}/secrets/{{ inventory_hostname }}"
git_repositories: []
samba_shares: []
samba_users: []
compose_pull: missing
jarvis_enabled_observability: true
jarvis_exporter_build: false
jarvis_exporter_image: ""
jarvis_migration_ready: false
jarvis_models: []
