---
- name: Appliquer la configuration du homelab
  hosts: all
  become: true
  gather_facts: true
  serial: 1
  pre_tasks:
    - name: Ignorer les machines dont la gestion n'est pas activée
      ansible.builtin.meta: end_host
      when: not (managed_enabled | bool)
      tags: [always]
    - name: Vérifier la famille de système
      ansible.builtin.assert:
        that:
          - ansible_facts.os_family == 'Debian'
        fail_msg: Ce socle gère Raspberry Pi OS 64 bits et Ubuntu/Debian.
      tags: [always]
  roles:
    - role: base
      tags: [base]
    - role: docker
      when: docker_enabled | bool
      tags: [docker]
    - role: nas
      when: nas_enabled | bool
      tags: [nas]
    - role: jarvis
      when: jarvis_enabled | bool
      tags: [jarvis]
